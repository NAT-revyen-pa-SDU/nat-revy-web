<dialog class="lightbox" id="lightbox" aria-label="Billedvisning">
	<img alt="">
	<p class="lightbox-caption"></p>
	<button type="button" class="lightbox-btn lightbox-close" data-step="0" aria-label="Luk">✕</button>
	<button type="button" class="lightbox-btn lightbox-prev" data-step="-1" aria-label="Forrige billede">‹</button>
	<button type="button" class="lightbox-btn lightbox-next" data-step="1" aria-label="Næste billede">›</button>
</dialog>

<div id="footer"></div>

<script src="layout.js"></script>
<script>
	// Lightbox: vis billederne i stor størrelse og bladr med pile, tastatur eller swipe
	(() => {
		const links = [...document.querySelectorAll('.gallery-grid a')], box = document.getElementById('lightbox');
		const img = box.querySelector('img'), caption = box.querySelector('.lightbox-caption');
		let current = 0, x0 = null, swiped = false;

		const show = i => {
			current = (i + links.length) % links.length;
			img.src = links[current].href;
			img.alt = caption.textContent = links[current].querySelector('img').alt;
		};

		links.forEach((a, i) => a.addEventListener('click', e => {
			e.preventDefault();
			show(i);
			box.showModal();
		}));
		box.addEventListener('click', e => {
			if (swiped) return swiped = false;
			const step = e.target.dataset.step;
			if (step === '0' || e.target === box) box.close();
			else if (step) show(current + Number(step));
		});
		box.addEventListener('keydown', e => {
			if (e.key === 'ArrowLeft') show(current - 1);
			if (e.key === 'ArrowRight') show(current + 1);
		});
		box.addEventListener('pointerdown', e => {
			x0 = e.clientX;
			swiped = false;
		});
		box.addEventListener('pointerup', e => {
			if (x0 !== null && Math.abs(e.clientX - x0) > 50) {
				show(current + (e.clientX < x0 ? 1 : -1));
				swiped = true;
			}
			x0 = null;
		});
	})();
</script>

</body>
