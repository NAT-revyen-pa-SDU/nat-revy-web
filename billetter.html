<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetsalget er afsluttet - NAT Revyen</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar"></div>

<section class="about contact-page">
    <div class="about-inner contact-layout">
        <div class="about-text-wrapper contact-simple">
            <h2>Billetsalget er afsluttet</h2>
            <p>Tak til alle, der kom forbi i Studenterhuset Odense. Følg med her, når næste års billetter åbner.</p>

            <!--
            NÆSTE ÅR: Gendan billetsalget ved at indsætte nye event-link i blokken herunder
            og ændre overskrift/tekst ovenfor. Husk også at gendanne "Køb Billet"-CTA'en i navbar.html og index.html.
            <div class="contact-panel ticket-panel">
                <a class="contact-link ticket-link" href="https://event-link.dk/arrangement/60722/" target="_blank" rel="noopener noreferrer">
                    <span><strong>1/10</strong><small>Kl. 19-22</small></span>
                    <span>Vælg billetter</span>
                </a>
                <a class="contact-link ticket-link" href="https://event-link.dk/arrangement/60724/" target="_blank" rel="noopener noreferrer">
                    <span><strong>2/10</strong><small>Kl. 19-22</small></span>
                    <span>Vælg billetter</span>
                </a>
                <a class="contact-link ticket-link" href="https://event-link.dk/arrangement/60725/" target="_blank" rel="noopener noreferrer">
                    <span><strong>3/10</strong><small>Kl. 14-17</small></span>
                    <span>Vælg billetter</span>
                </a>
                <a class="contact-link ticket-link" href="https://event-link.dk/arrangement/60726/" target="_blank" rel="noopener noreferrer">
                    <span><strong>3/10</strong><small>Kl. 19-22</small></span>
                    <span>Vælg billetter</span>
                </a>
            </div>
            -->
        </div>
    </div>
</section>

<div id="footer"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch("navbar.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;

                const hamburger = document.getElementById("hamburger");
                const mobileMenu = document.getElementById("mobileMenu");

                if (hamburger) {
                    hamburger.addEventListener("click", () => {
                        mobileMenu.classList.toggle("active");
                    });
                }

                const links = document.querySelectorAll('.nav-links a');
                links.forEach(link => {
                    if (link.textContent.trim().toLowerCase() === 'køb billet') {
                        link.classList.add('active');
                    }
                });
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });
    });
</script>

</body>
</html>
